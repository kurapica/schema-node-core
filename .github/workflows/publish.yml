name: Publish Package

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Check versions
        run: |
          node -v
          npm -v

      - run: npm install

      - run: npm run build

      - name: Publish
        run: npm publish
